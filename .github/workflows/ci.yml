name: CI - Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Frontend Tests
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Uma única execução: `--coverage` já roda a suíte. Antes eram DUAS
      # execuções, e a segunda falhava sempre — `@vitest/coverage-v8` nunca
      # tinha sido instalado, e o `continue-on-error: true` escondia isso.
      # O portão "coverage informativo" que a spec 003 documenta nunca havia
      # produzido um relatório.
      - name: Run tests with coverage
        run: npm test -- --run --reporter=verbose --coverage
        env:
          CI: true

      - name: Upload coverage to artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 30

  # Frontend Lint
  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # BLOQUEANTE desde a spec 003.
      - name: Run ESLint
        run: npm run lint

  # Frontend Build
  frontend-build:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          VITE_API_URL: https://jiu-metrics-backend.vercel.app/api

      - name: Check build size
        run: |
          echo "## Build Size Report" >> $GITHUB_STEP_SUMMARY
          echo "Build completed successfully!" >> $GITHUB_STEP_SUMMARY
          du -sh dist >> $GITHUB_STEP_SUMMARY

  # Backend Tests
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Sem continue-on-error: com a suíte 100% verde, testes quebrados
      # passam a bloquear a PR (o continue-on-error antigo é o motivo de
      # 10 testes quebrados terem vivido meses no repositório sem ninguém ver).
      - name: Run tests
        run: npm test
        env:
          CI: true
          NODE_ENV: test

  # Backend Lint — introduzido pela spec 003.
  # BLOQUEANTE. O conjunto de regras é deliberadamente mínimo (só erro real,
  # não estilo) — ver server/eslint.config.js.
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # Backend Typecheck — introduzido pela spec 011 (etapa 1 do ADR-010).
  # BLOQUEANTE. Cobre só os arquivos com `// @ts-check` (models/ e utils/);
  # o `tsconfig.json` não liga `checkJs` global, então o resto de `src/` não
  # é verificado. Sem este job, o `npm run typecheck` que a spec criou só
  # existiria na máquina de quem lembrasse de rodar.
  backend-typecheck:
    name: Backend Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tsc
        run: npm run typecheck

  backend-security:
    name: Backend Security Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # `--production` foi renomeada para `--omit=dev` no npm 9; a antiga
      # ainda funciona com aviso, e é o tipo de coisa que quebra em silêncio
      # numa atualização de runner.
      - name: Run npm audit
        run: npm audit --omit=dev
        continue-on-error: true

  # Integration Check
  integration-check:
    name: Integration Check
    runs-on: ubuntu-latest
    # spec 003: o gate de integração passa a exigir também os dois jobs de lint,
    # para que um único check reflita o estado real de todos os portões.
    needs: [frontend-tests, frontend-lint, frontend-build, backend-tests, backend-lint, backend-typecheck]
    
    steps:
      - name: Integration summary
        run: |
          echo "## ✅ Integration Check Passed" >> $GITHUB_STEP_SUMMARY
          echo "Todos os portões bloqueantes passaram." >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Frontend: testes + lint + build" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Backend: testes + lint + typecheck" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Portões informativos (não bloqueiam): coverage, npm audit, CodeQL, Lighthouse." >> $GITHUB_STEP_SUMMARY
          echo "Secrets scanning bloqueia em job separado (code-quality.yml)." >> $GITHUB_STEP_SUMMARY
          echo "E2E (Playwright) ainda NÃO roda no CI — ver specs/003-quality-gates/spec.md." >> $GITHUB_STEP_SUMMARY
