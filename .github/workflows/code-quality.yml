name: Code Quality

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main ]

jobs:
  # Dependency Review (apenas para PRs)
  # DESABILITADO: Requer habilitar "Dependency graph" em Settings > Security > Code security and analysis
  # Para habilitar: https://github.com/lucasxtech/JiuMetrics/settings/security_analysis
  # dependency-review:
  #   name: Dependency Review
  #   runs-on: ubuntu-latest
  #   if: github.event_name == 'pull_request'
  #   
  #   steps:
  #     - name: Checkout code
  #       uses: actions/checkout@v4
  #     
  #     - name: Dependency Review
  #       uses: actions/dependency-review-action@v4

  # Code Scanning
  code-scanning:
    name: Code Scanning
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # Check for secrets
  secrets-scan:
    name: Secrets Scanning
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # BLOQUEANTE desde a spec 003. O continue-on-error anterior é o motivo
      # de uma chave da API do Gemini ter entrado no repositório e sobrevivido
      # meses sem ninguém ver (ver AUDIT.md §9 SEC-C1).
      #
      # O escopo é o DIFF (base..head), não o histórico — então segredo que já
      # está no histórico não bloqueia PR nova; o que este portão impede é a
      # entrada de segredo NOVO.
      #
      # --only-verified: só bloqueia segredo que o TruffleHog confirmou como
      # ativo, reduzindo falso positivo em fixture e arquivo de exemplo.
      #
      # ⚠️ LIMITAÇÃO CONHECIDA: detecta segredo por padrão reconhecível (chave
      # de API com formato verificável). NÃO pega senha genérica em variável de
      # ambiente — ver o achado em specs/003-quality-gates/spec.md.
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  # Check package versions
  outdated-dependencies:
    name: Check Outdated Dependencies
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check Frontend Dependencies
        working-directory: frontend
        run: |
          echo "## Frontend Dependencies Status" >> $GITHUB_STEP_SUMMARY
          npm outdated || true
          npm outdated >> $GITHUB_STEP_SUMMARY || echo "All dependencies up to date!" >> $GITHUB_STEP_SUMMARY

      - name: Check Backend Dependencies
        working-directory: server
        run: |
          echo "## Backend Dependencies Status" >> $GITHUB_STEP_SUMMARY
          npm outdated || true
          npm outdated >> $GITHUB_STEP_SUMMARY || echo "All dependencies up to date!" >> $GITHUB_STEP_SUMMARY
